name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin majstack --bin majstackd
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: tar czf majstack-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release majstack majstackd
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/majstack.exe, target/${{ matrix.target }}/release/majstackd.exe -DestinationPath majstack-${{ matrix.target }}.zip
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            majstack-${{ matrix.target }}.tar.gz
            majstack-${{ matrix.target }}.zip
          fail_on_unmatched_files: false
